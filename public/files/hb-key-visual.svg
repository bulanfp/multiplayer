<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <!-- Mock preview of "Holiday Blend key visual.png" -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E1810"/>
      <stop offset="1" stop-color="#6E351B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.48" r="0.48">
      <stop offset="0" stop-color="#F2A65A" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#F2A65A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F3E3CF"/>
      <stop offset="0.55" stop-color="#FFF7EC"/>
      <stop offset="1" stop-color="#E2CBB0"/>
    </linearGradient>
    <linearGradient id="sleeve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9C4421"/>
      <stop offset="0.5" stop-color="#C2602F"/>
      <stop offset="1" stop-color="#8E3C1C"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <!-- Steam -->
  <g fill="none" stroke="#F6E7D3" stroke-width="10" stroke-linecap="round" opacity="0.55">
    <path d="M1100 300 C1070 250 1130 220 1100 170 C1080 135 1110 110 1100 80"/>
    <path d="M1160 290 C1130 235 1195 205 1160 150 C1140 115 1170 90 1160 60"/>
    <path d="M1220 300 C1190 250 1250 220 1220 170 C1200 135 1230 110 1220 80"/>
  </g>

  <!-- Cup -->
  <path d="M990 420 H1330 L1292 870 Q1290 892 1268 892 H1052 Q1030 892 1028 870 Z" fill="url(#cup)"/>
  <path d="M1006 565 H1314 L1302 715 H1018 Z" fill="url(#sleeve)"/>
  <text x="1160" y="632" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#FFF4E6" letter-spacing="4">HOLIDAY</text>
  <text x="1160" y="672" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#FFF4E6" letter-spacing="4">BLEND</text>
  <rect x="966" y="372" width="388" height="58" rx="24" fill="#FFF7EC"/>
  <path d="M1000 372 Q1006 336 1046 332 H1274 Q1314 336 1320 372 Z" fill="#F0DFC9"/>

  <!-- Cinnamon sticks and star anise -->
  <g transform="translate(860 860) rotate(-18)">
    <rect x="0" y="0" width="230" height="34" rx="17" fill="#8A3F1D"/>
    <rect x="0" y="9" width="230" height="5" fill="#A9552B" opacity="0.7"/>
    <rect x="22" y="40" width="210" height="30" rx="15" fill="#7A3518"/>
  </g>
  <g transform="translate(1420 820)" fill="#5A2A15">
    <path d="M0 -46 L12 -12 L46 0 L12 12 L0 46 L-12 12 L-46 0 L-12 -12 Z"/>
    <path d="M-33 -33 L-4 -8 L33 -33 L8 -4 L33 33 L4 8 L-33 33 L-8 4 Z" opacity="0.85"/>
    <circle r="7" fill="#C2602F"/>
  </g>

  <!-- Coffee beans -->
  <g fill="#1F0F09">
    <g transform="translate(1390 470) rotate(30)"><ellipse rx="26" ry="18"/><path d="M-22 0 Q0 -8 22 0" stroke="#5A2A15" stroke-width="4" fill="none"/></g>
    <g transform="translate(1450 560) rotate(-20)"><ellipse rx="22" ry="15"/><path d="M-18 0 Q0 -7 18 0" stroke="#5A2A15" stroke-width="4" fill="none"/></g>
    <g transform="translate(900 300) rotate(55)"><ellipse rx="20" ry="14"/><path d="M-16 0 Q0 -6 16 0" stroke="#5A2A15" stroke-width="4" fill="none"/></g>
  </g>

  <!-- Copy -->
  <text x="120" y="300" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="600" fill="#F2C9A0" letter-spacing="8">CENTRAL PERK</text>
  <text x="112" y="460" font-family="Georgia, 'Times New Roman', serif" font-size="150" font-weight="700" fill="#FFF4E6">Holiday</text>
  <text x="112" y="610" font-family="Georgia, 'Times New Roman', serif" font-size="150" font-weight="700" fill="#FFF4E6">Blend</text>
  <text x="120" y="690" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="38" fill="#F2C9A0">Roasted with cinnamon for cold mornings.</text>
  <rect x="120" y="752" width="330" height="70" rx="35" fill="#F2A65A"/>
  <text x="285" y="798" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#2E1810">1–31 December</text>
</svg>
